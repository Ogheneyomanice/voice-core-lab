#!KAMAILIO
#
# Minimal SIP registrar + proxy for the voice core lab.
# It plays the call-control role (comparable to a CSCF in an IMS network).
#
# Lab simplifications (see README, "Limitations"):
#   - no authentication
#   - registrations are kept in memory (db_mode 0), so each node has its own
#   - no Record-Route, so simple test user agents work without a route set

####### Global parameters #########

debug=2
log_stderror=yes
log_facility=LOG_LOCAL0

fork=yes
children=4
auto_aliases=no

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

####### Modules #########

loadmodule "kex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"

modparam("usrloc", "db_mode", 0)
modparam("registrar", "max_expires", 3600)

####### Routing logic #########

request_route {
    xlog("L_INFO", "$rm $ru from $si:$sp\n");

    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP message from $si:$sp\n");
        exit;
    }

    # Health check: OPTIONS addressed to the proxy itself.
    if (is_method("OPTIONS") && uri == myself && $rU == $null) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (has_totag()) {
        # In-dialog request that carries a route set.
        if (loose_route()) {
            route(RELAY);
            exit;
        }
        # ACK for a non-2xx final response.
        if (is_method("ACK") && t_check_trans()) {
            route(RELAY);
            exit;
        }
        # Lab simplification: other in-dialog requests (ACK for 2xx, BYE)
        # from user agents without a route set fall through to the
        # location lookup below.
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    t_check_trans();

    if (is_method("REGISTER")) {
        if (!save("location")) {
            sl_reply_error();
        }
        exit;
    }

    if ($rU == $null) {
        sl_send_reply("484", "Address Incomplete");
        exit;
    }

    if (!lookup("location")) {
        $var(rc) = $rc;
        t_newtran();
        switch ($var(rc)) {
            case -1:
            case -3:
                send_reply("404", "Not Found");
                exit;
            case -2:
                send_reply("405", "Method Not Allowed");
                exit;
        }
    }

    route(RELAY);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
